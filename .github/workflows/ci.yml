name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # google-services.json tidak ada di repo — build tetap jalan karena
      # strategi MissingGoogleServicesStrategy.WARN sudah diatur di app/build.gradle.kts.
      # resource default_* dihasilkan dari dummy placeholder di bawah.
      - name: Generate placeholder google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "taskflow-ci-placeholder",
              "storage_bucket": "taskflow-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000abcdef",
                  "android_client_info": { "package_name": "com.aistudio.taskflow.kqzpmv" }
                },
                "oauth_client": [
                  { "client_id": "123456789000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "AIzaSyA_PLACEHOLDER_KEY_FOR_CI_BUILD_0000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests (JVM + Robolectric)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

  rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (untuk emulator Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run rules tests via emulator
        run: npm run test:rules
