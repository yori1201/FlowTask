name: CI


on:
  push:
    branches: [main]
  pull_request:


jobs:
  android:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'


      # SDK Android sudah preinstall di runner ubuntu-latest (ANDROID_HOME
      # diset, lisensi diterima). AGP otomatis memasang komponen yang kurang.
      # Catatan: android-actions/setup-android@v3 tidak dipakai lagi karena
      # mencoba menginstal paket legacy 'tools' yang sudah dihapus Google.


      # google-services.json tidak ada di repo — build tetap jalan karena
      # strategi MissingGoogleServicesStrategy.WARN sudah diatur di app/build.gradle.kts.
      # Bila secret GOOGLE_SERVICES_JSON (base64 file asli dari Firebase Console)
      # sudah diatur, file asli dipakai supaya login Google dan sinkronisasi
      # Firestore aktif di APK hasil CI. Bila belum, dummy placeholder di
      # bawah yang dipakai (mode lokal tetap berfungsi).

      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "taskflow-ci-placeholder",
              "storage_bucket": "taskflow-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000abcdef",
                  "android_client_info": { "package_name": "com.aistudio.taskflow.kqzpmv" }
                },
                "oauth_client": [
                  { "client_id": "123456789000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEY-DO-NOT-USE" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi


      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
