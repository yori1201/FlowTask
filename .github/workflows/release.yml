name: Release APK

# Membangun APK RELEASE ter-sign secara otomatis setiap kali tag v* di-push,
# lalu melampirkan APK-nya ke GitHub Release.
#
# SYARAT (sekali saja, lihat README bagian "CI & Rilis"):
#   1. Repo secret KEYSTORE_BASE64   = isi my-upload-key.jks dalam base64
#   2. Repo secret KEYSTORE_PASSWORD = password keystore (store & key sama)
# Tanpa kedua secret ini semua langkah build dilewati dan workflow selesai
# hijau dengan notifikasi (bukan gagal).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish APK release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cek konfigurasi keystore
        id: cfg
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD belum diatur - melewati build release. Cara mengatur: README bagian 'CI & Rilis'."
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        if: steps.cfg.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      # SDK Android sudah preinstall di runner ubuntu-latest (ANDROID_HOME
      # diset, lisensi diterima). AGP otomatis memasang komponen yang kurang.

      # google-services.json tidak ada di repo (disengaja). Build tetap jalan
      # karena MissingGoogleServicesStrategy.WARN; resource default_* dihasilkan
      # dari placeholder di bawah. Mode lokal tetap berfungsi penuh.
      - name: Generate placeholder google-services.json
        if: steps.cfg.outputs.configured == 'true'
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "taskflow-ci-placeholder",
              "storage_bucket": "taskflow-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000abcdef",
                  "android_client_info": { "package_name": "com.aistudio.taskflow.kqzpmv" }
                },
                "oauth_client": [
                  { "client_id": "123456789000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "AIzaSyA_PLACEHOLDER_KEY_FOR_CI_BUILD_0000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Decode keystore rilis
        if: steps.cfg.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK release (R8)
        if: steps.cfg.outputs.configured == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK sesuai tag
        if: steps.cfg.outputs.configured == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          mv "$APK" "TaskFlow-${GITHUB_REF_NAME}-release.apk"

      - name: Lampirkan ke GitHub Release
        if: steps.cfg.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: TaskFlow-${{ github.ref_name }}-release.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.ref_name }}

            **Cara pasang**: unduh `TaskFlow-${{ github.ref_name }}-release.apk`,
            buka di HP Android, izinkan "instal aplikasi tidak dikenal" bila
            diminta, lalu tekan *Install*. Saat pertama dibuka pilih
            **"Lanjutkan tanpa akun"** untuk memakai mode lokal (semua fitur
            berfungsi tanpa internet dan tanpa akun).

            > Tombol "Masuk dengan Google" baru berfungsi setelah
            > `google-services.json` asli diletakkan di `app/` dan dibangun
            > ulang (lihat README).

            Dibangun otomatis oleh GitHub Actions dari tag ini, ditandatangani
            keystore rilis TaskFlow.
